[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spinfreq"
version = "0.1.0rc2"
description = "Frequency-domain micromagnetics for periodic and confined thin films"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
web-test = ["httpx>=0.27,<1", "playwright>=1.48,<2"]
docs = ["Markdown==3.11.2"]

[project.scripts]
spinfreq = "spinfreq.cli:main"
spinfreq-web = "spinfreq.web.app:main"
spinfreq-verify-evidence = "spinfreq.qualification:main"
spinfreq-study = "spinfreq.studies:main"
spinfreq-track = "spinfreq.tracking:main"
spinfreq-susceptibility = "spinfreq.susceptibility:main"
spinfreq-demo = "spinfreq.onboarding:demo_main"
spinfreq-doctor = "spinfreq.onboarding:doctor_main"

[project.urls]
Repository = "https://github.com/spinuni/spinfreq"
Documentation = "https://github.com/spinuni/spinfreq/blob/main/docs/guides/USAGE.md"
Validation = "https://github.com/spinuni/spinfreq/blob/main/docs/science/VALIDATION_AND_RELEASE.md"

[tool.setuptools.packages.find]
include = ["spinfreq*"]

[tool.setuptools.package-data]
"spinfreq.web" = ["static/*.html", "static/*.js", "static/*.css", "static/*.png"]
