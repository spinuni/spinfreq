name: Deploy SpinFreq website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site build and browser dependencies
        run: python -m pip install '.[docs,web-test]'
      - name: Verify handbook and export website
        run: python scripts/build_site.py --check --export results/site
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Check pages, navigation and preset downloads
        run: python scripts/site_smoke.py results/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: results/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
