name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python scripts/sync_examples.py --check
      - run: python -m pytest -q

  research-workflows:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: spinfreq-study --config examples/studies/fmr-field-sweep.json --dry-run
      - run: python benchmarks/research_studies.py --check --output results/research
      - run: python benchmarks/research_continuation.py --check --output results/research/skyrmion
      - run: python benchmarks/spatial_spectroscopy.py --check --output results/research/spectroscopy
      - run: python benchmarks/susceptibility_tensor.py --check --output results/research/tensor-validation
      - run: python benchmarks/pole_groups.py --check --output results/research/pole-groups
      - run: python benchmarks/mode_tracking.py --study results/research/skyrmion/study --check --output results/research/mode-tracking
      - name: Reuse verified study through the installed CLI
        run: spinfreq-study --config examples/studies/fmr-field-sweep.json --output results/research/fmr-field-sweep --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-workflow-comparison
          path: results/research/

  desktop-onboarding:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,web]'
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Test candidate installer and demo on the native host
        run: python scripts/check_candidate_installer.py --wheel dist --output results/installer-smoke
      - run: spinfreq-doctor --check
      - run: spinfreq-demo --output results/first-result
      - run: spinfreq-examples --list
      - run: spinfreq-examples --name localized-source --output results/editable-example
      - run: python results/editable-example/run.py
      - run: spinfreq-susceptibility --job results/first-result --output results/first-tensor
      - run: python -m pytest -q tests/test_onboarding.py tests/test_tracking.py tests/test_susceptibility.py tests/test_pole_groups.py tests/test_bundled_examples.py
      - name: Exercise source-install and demo helpers on native Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call windows\Install.cmd --ci
          if errorlevel 1 exit /b 1
          call windows\Run-Demo.cmd --ci
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-result-${{ runner.os }}
          path: |
            results/first-result/
            results/first-simulation/
            results/editable-example/
            results/installer-smoke/installation.json
            results/installer-smoke/installer-smoke.json
            results/installer-smoke/preview.log

  fmr-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python benchmarks/fmr_standard_problem.py --fetch-reference --check --output results/fmr-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmr-comparison
          path: results/fmr-ci/

  dmi-static-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python benchmarks/dmi_standard_problem.py --fetch-reference --skip-dispersion --check --output results/dmi-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmi-static-comparison
          path: results/dmi-ci/

  dmi-temporal-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verify and analyze archived independent OOMMF runs
        run: |
          python benchmarks/dmi_temporal.py restore --workdir results/oommf-full
          python benchmarks/dmi_temporal.py restore --reference validation/dmi_temporal/half_amplitude --workdir results/oommf-half
          python benchmarks/dmi_temporal.py analyze --workdir results/oommf-full --output results/temporal-ci --check
          python benchmarks/dmi_temporal.py analyze --workdir results/oommf-half --output results/temporal-ci/half_amplitude --check
          python benchmarks/dmi_temporal.py scaling --output results/temporal-ci --half-output results/temporal-ci/half_amplitude --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmi-temporal-comparison
          path: results/temporal-ci/

  skyrmion-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verify and analyze independent skyrmion references at two fields
        run: |
          for case_name in field_0mT field_50mT; do
            python benchmarks/skyrmion_temporal.py restore --reference validation/skyrmion_temporal/$case_name --workdir results/oommf-$case_name
            python benchmarks/skyrmion_temporal.py analyze --workdir results/oommf-$case_name --output results/skyrmion-ci/$case_name --check
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyrmion-comparison
          path: results/skyrmion-ci/

  fine-skyrmion-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Reanalyze fine-grid dynamics and verify two-field qualification
        run: |
          for case_name in field_0mT field_50mT; do
            python benchmarks/skyrmion_temporal.py restore --reference validation/skyrmion_fine/$case_name --workdir results/fine-$case_name
            python benchmarks/skyrmion_temporal.py analyze --workdir results/fine-$case_name --output results/fine-ci/$case_name --check
          done
          python benchmarks/skyrmion_temporal.py qualify --reference results/fine-ci --output results/fine-ci --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fine-skyrmion-comparison
          path: results/fine-ci/

  driven-response-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Reanalyze independent full and half multitone drives
        run: |
          python benchmarks/driven_response.py restore --reference validation/driven_response/full --workdir results/driven-full
          python benchmarks/driven_response.py restore --reference validation/driven_response/half --workdir results/driven-half
          python benchmarks/driven_response.py restore --reference validation/driven_response/tight --workdir results/driven-tight
          python benchmarks/driven_response.py restore --reference validation/driven_response/step_refinement/tight --workdir results/driven-step
          python benchmarks/driven_response.py analyze --workdir results/driven-full --half-workdir results/driven-half --output results/driven-ci --check
          python benchmarks/driven_response.py tolerance --workdir results/driven-full --tight-workdir results/driven-tight --output results/driven-ci --check
          python benchmarks/driven_response.py tolerance --workdir results/driven-full --tight-workdir results/driven-step --output results/driven-ci/step_refinement --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driven-response-comparison
          path: results/driven-ci/

  platform-workers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,web,web-test]' build
      - run: python -m build --wheel
      - name: Install the exact wheel to be qualified
        run: python -c "import pathlib,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--no-deps','--force-reinstall',str(next(pathlib.Path('dist').glob('*.whl')))])"
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Collect installed-wheel tests and native browser evidence
        run: python scripts/qualify_platform.py --wheel dist --expect-platform ${{ matrix.platform }} --output results/platform --require-clean
      - name: Independently verify platform, revision, tests and downloads
        run: python -m spinfreq.qualification results/platform --source-root . --expect-platform ${{ matrix.platform }} --expect-revision ${{ github.sha }} --require-clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-qualification-${{ matrix.platform }}
          path: results/platform/

  application:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,web,web-test,docs]'
      - name: Verify handbook sources and export the product website
        run: python scripts/build_site.py --check --export results/product-site
      - run: python -m pytest -q tests/test_handbook.py
      - run: python -m pytest -q tests/test_jobs.py tests/test_web.py tests/test_portable_web.py
      - run: python scripts/validate_presets.py --output results/release-presets
      - run: python -m playwright install --with-deps chromium
      - name: Browse the exported documentation without a simulation backend
        run: python scripts/site_smoke.py results/product-site
      - name: Real browser through worker to exported results
        run: |
          spinfreq-web --data-dir results/web-browser --port 8000 > results/web-server.log 2>&1 &
          SPINFREQ_WEB_PID=$!
          trap 'kill "$SPINFREQ_WEB_PID" 2>/dev/null || true' EXIT
          python scripts/browser_smoke.py --output results/browser
      - name: Preview and configuration download without a worker
        run: |
          spinfreq-web --mode landing --port 8001 > results/preview-server.log 2>&1 &
          SPINFREQ_PREVIEW_PID=$!
          trap 'kill "$SPINFREQ_PREVIEW_PID" 2>/dev/null || true' EXIT
          python scripts/browser_smoke.py --url http://127.0.0.1:8001 --landing --output results/preview-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-checks
          path: |
            results/product-site/
            results/release-presets/summary.json
            results/release-presets/*.log
            results/browser/
            results/preview-browser/
            results/preview-server.log
            results/web-server.log

  distribution:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv /tmp/spinfreq-wheel
          SPINFREQ_WHEEL=(dist/*.whl)
          /tmp/spinfreq-wheel/bin/python -m pip install "${SPINFREQ_WHEEL[0]}[web,web-test]" pytest
      - name: Verify candidate bootstrap scripts are included in the source archive
        run: python -c "import pathlib,tarfile; archive=tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))); names=archive.getnames(); assert any(name.endswith('/scripts/release_assets/install.py') for name in names); assert any(name.endswith('/scripts/release_assets/Install.cmd') for name in names)"
      - name: Exercise the installed entry point outside the source checkout
        working-directory: /tmp
        run: |
          /tmp/spinfreq-wheel/bin/spinfreq --nx 3 --ny 3 --seed uniform --points 3 --output /tmp/spinfreq-smoke
          test -s /tmp/spinfreq-smoke/summary.json
          test -s /tmp/spinfreq-smoke/modes.npz
          test -s /tmp/spinfreq-smoke/response.npz
          test -s /tmp/spinfreq-smoke/spectrum.png
          /tmp/spinfreq-wheel/bin/spinfreq-examples --list
          /tmp/spinfreq-wheel/bin/spinfreq-examples --name localized-source --output /tmp/spinfreq-installed-example
          /tmp/spinfreq-wheel/bin/python /tmp/spinfreq-installed-example/run.py
      - name: Check that the source distribution contains runnable tests and benchmarks
        run: |
          mkdir /tmp/spinfreq-source
          tar -xzf dist/*.tar.gz --strip-components=1 -C /tmp/spinfreq-source
          cd /tmp
          /tmp/spinfreq-wheel/bin/python -m pytest --import-mode=importlib -q /tmp/spinfreq-source/tests
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  release-candidate:
    name: Assemble candidate for review
    runs-on: ubuntu-latest
    needs:
      - test
      - research-workflows
      - desktop-onboarding
      - fmr-reference
      - dmi-static-reference
      - dmi-temporal-reference
      - skyrmion-reference
      - fine-skyrmion-reference
      - driven-response-reference
      - platform-workers
      - application
      - distribution
    env:
      SPINFREQ_CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: results/distributions
      - uses: actions/download-artifact@v4
        with:
          name: platform-qualification-linux
          path: results/linux-evidence
      - uses: actions/download-artifact@v4
        with:
          name: platform-qualification-win32
          path: results/windows-evidence
      - name: Record all prerequisite job conclusions from this run
        run: python -c "import os,pathlib; pathlib.Path('results/ci-results.json').write_text(os.environ['SPINFREQ_CI_NEEDS'])"
      - name: Verify exact source, distributions and native evidence
        run: >-
          python scripts/prepare_release_candidate.py
          --distributions results/distributions
          --linux-evidence results/linux-evidence
          --windows-evidence results/windows-evidence
          --ci-results results/ci-results.json
          --expect-revision ${{ github.sha }}
          --expect-run-id ${{ github.run_id }}
          --output results/release-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-review
          path: results/release-candidate/
          if-no-files-found: error
