name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q

  fmr-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python benchmarks/fmr_standard_problem.py --fetch-reference --check --output results/fmr-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmr-comparison
          path: results/fmr-ci/

  dmi-static-reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python benchmarks/dmi_standard_problem.py --fetch-reference --skip-dispersion --check --output results/dmi-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmi-static-comparison
          path: results/dmi-ci/

  distribution:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv /tmp/spinfreq-wheel
          /tmp/spinfreq-wheel/bin/python -m pip install dist/*.whl pytest
      - name: Exercise the installed entry point outside the source checkout
        working-directory: /tmp
        run: |
          /tmp/spinfreq-wheel/bin/spinfreq --nx 3 --ny 3 --seed uniform --points 3 --output /tmp/spinfreq-smoke
          test -s /tmp/spinfreq-smoke/summary.json
          test -s /tmp/spinfreq-smoke/modes.npz
          test -s /tmp/spinfreq-smoke/response.npz
          test -s /tmp/spinfreq-smoke/spectrum.png
      - name: Check that the source distribution contains runnable tests and benchmarks
        run: |
          mkdir /tmp/spinfreq-source
          tar -xzf dist/*.tar.gz --strip-components=1 -C /tmp/spinfreq-source
          cd /tmp/spinfreq-source
          /tmp/spinfreq-wheel/bin/python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
